<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6E8;
    --surface:#FFFFFF;
    --surface-alt:#FBF1DC;
    --border:#EAD3A0;
    --ink:#4A1D07;
    --ink-soft:#7A4420;
    --ink-faint:#A67B4A;
    --orange:#E08A2C;
    --orange-ink:#FFFFFF;
    --copper:#B85A1E;
    --brown:#4A1D07;
    --gold:#F5AE5E;
    --success:#4C7A4A;
    --success-bg:#E7EFDF;
    --shadow:rgba(74,29,7,0.16);
    --diego-bubble:#FFFFFF;
    --user-bubble:#4A1D07;
    --user-bubble-ink:#FFF6E8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C1208;
      --surface:#2A1B0E;
      --surface-alt:#241708;
      --border:#4A3319;
      --ink:#F8E3C0;
      --ink-soft:#D4B48C;
      --ink-faint:#9C8060;
      --orange:#F5AE5E;
      --orange-ink:#2A1208;
      --copper:#E08A2C;
      --brown:#F5AE5E;
      --gold:#E0A94A;
      --success:#8FC28A;
      --success-bg:#2C3B26;
      --shadow:rgba(0,0,0,0.45);
      --diego-bubble:#2A1B0E;
      --user-bubble:#E08A2C;
      --user-bubble-ink:#2A1208;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C1208;
    --surface:#2A1B0E;
    --surface-alt:#241708;
    --border:#4A3319;
    --ink:#F8E3C0;
    --ink-soft:#D4B48C;
    --ink-faint:#9C8060;
    --orange:#F5AE5E;
    --orange-ink:#2A1208;
    --copper:#E08A2C;
    --brown:#F5AE5E;
    --gold:#E0A94A;
    --success:#8FC28A;
    --success-bg:#2C3B26;
    --shadow:rgba(0,0,0,0.45);
    --diego-bubble:#2A1B0E;
    --user-bubble:#E08A2C;
    --user-bubble-ink:#2A1208;
  }

  /* box-sizing limité au widget : ne touche jamais le reste du site */
  .diego-launcher, .diego-panel, .diego-launcher *, .diego-panel *{box-sizing:border-box;}

  .diego-launcher{
    position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;
    background:linear-gradient(145deg,var(--orange),var(--copper) 55%,var(--brown));
    border:none;cursor:pointer;box-shadow:0 10px 26px var(--shadow);
    display:flex;align-items:center;justify-content:center;z-index:99999;overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease;
    animation:diego-pulse 3.6s ease-in-out infinite;
  }
  .diego-launcher svg{width:100%;height:100%;}
  .diego-launcher:hover{transform:scale(1.07);box-shadow:0 14px 30px var(--shadow);}
  .diego-launcher::after{
    content:"Discuter avec Diego";
    position:absolute;right:calc(100% + 14px);top:50%;transform:translateY(-50%) translateX(4px);
    background:var(--brown);color:#FFF6E8;font-size:13px;font-weight:600;
    padding:7px 13px;border-radius:8px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;
    font-family:"Inter",sans-serif;text-transform:none;letter-spacing:0;
    box-shadow:0 6px 16px var(--shadow);
  }
  .diego-launcher:hover::after{opacity:1;transform:translateY(-50%) translateX(0);}
  @media (max-width:480px){.diego-launcher::after{display:none;}}
  .diego-badge{
    position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;
    border-radius:100px;background:var(--gold);color:#2A1810;
    font-family:"Inter",sans-serif;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--bg);transition:opacity .15s ease, transform .15s ease;
  }
  .diego-badge[hidden]{display:none;}
  @media (prefers-reduced-motion: reduce){.diego-launcher{animation:none;}}
  @keyframes diego-pulse{
    0%,100%{box-shadow:0 10px 26px var(--shadow);}
    50%{box-shadow:0 10px 30px var(--shadow), 0 0 0 8px rgba(224,138,44,0.14);}
  }

  .diego-panel{
    position:fixed;right:22px;bottom:96px;width:376px;max-width:calc(100vw - 32px);
    height:min(600px, calc(100vh - 140px));background:var(--surface);
    border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 50px var(--shadow);
    display:flex;flex-direction:column;overflow:hidden;z-index:99999;
    font-family:"Inter",system-ui,-apple-system,sans-serif;
  }
  .diego-panel[hidden]{display:none;}

  .diego-head{
    display:flex;align-items:center;gap:12px;padding:14px 16px;
    background:linear-gradient(120deg,var(--copper),var(--brown));color:#FFF6E8;
    flex-shrink:0;
  }
  .diego-avatar{
    width:38px;height:38px;border-radius:50%;background:rgba(255,246,232,0.16);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    border:1.5px solid rgba(255,246,232,0.4);overflow:hidden;
  }
  .diego-avatar svg{width:100%;height:100%;}
  .diego-head .who{flex:1;min-width:0;}
  .diego-head .name{font-family:"Montserrat",sans-serif;font-size:18px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;line-height:1.15;margin:0;}
  .diego-head .status{font-size:12.5px;display:flex;align-items:center;gap:6px;opacity:0.9;}
  .status .dot{width:7px;height:7px;border-radius:50%;background:#8FE08A;display:inline-block;}
  .diego-panel .icon-btn{
    background:transparent;border:none;color:#FFF6E8;cursor:pointer;padding:6px;
    border-radius:7px;display:flex;
  }
  .diego-panel .icon-btn:hover{background:rgba(255,246,232,0.14);}
  .diego-panel .icon-btn svg{width:18px;height:18px;stroke:currentColor;}

  .diego-thread{
    flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;
    background:var(--surface-alt);
  }
  .diego-panel .msg{display:flex;gap:8px;max-width:88%;animation:diego-rise 0.28s ease both;}
  @media (prefers-reduced-motion: reduce){.diego-panel .msg{animation:none;}}
  @keyframes diego-rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .diego-panel .msg.bot{align-self:flex-start;}
  .diego-panel .msg.user{align-self:flex-end;flex-direction:row-reverse;}
  .diego-panel .msg .mini-avatar{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;margin-top:2px;
    background:linear-gradient(145deg,var(--orange),var(--brown));
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .diego-panel .msg .mini-avatar svg{width:100%;height:100%;}
  .diego-panel .bubble{
    padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.48;margin:0;
  }
  .diego-panel .msg.bot .bubble{
    background:var(--diego-bubble);color:var(--ink);border:1px solid var(--border);
    border-top-left-radius:4px;
  }
  .diego-panel .msg.user .bubble{
    background:var(--user-bubble);color:var(--user-bubble-ink);
    border-top-right-radius:4px;
  }
  .diego-panel .bubble .ref{
    display:inline-block;background:rgba(0,0,0,0.06);padding:1px 6px;border-radius:5px;
    font-size:12.5px;
  }
  .diego-panel .bubble a.link-chip{
    display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:13px;
    font-weight:600;color:var(--copper);text-decoration:none;border:1px solid var(--border);
    padding:5px 10px;border-radius:100px;
  }
  .diego-panel .bubble a.link-chip svg{width:12px;height:12px;stroke:currentColor;}

  .diego-panel .typing .bubble{display:flex;gap:4px;align-items:center;padding:12px 14px;}
  .diego-panel .typing .dot2{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);animation:diego-blink 1.2s infinite ease-in-out;}
  .diego-panel .typing .dot2:nth-child(2){animation-delay:0.15s;}
  .diego-panel .typing .dot2:nth-child(3){animation-delay:0.3s;}
  @keyframes diego-blink{0%,80%,100%{opacity:0.25;}40%{opacity:1;}}
  @media (prefers-reduced-motion: reduce){.diego-panel .typing .dot2{animation:none;opacity:0.7;}}

  .quick-row{
    display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap;flex-shrink:0;
    background:var(--surface-alt);margin:0;
  }
  .diego-panel .chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface);
    border:1px solid var(--border);color:var(--ink);font-size:13px;font-weight:600;
    padding:7px 12px;border-radius:100px;cursor:pointer;text-transform:none;
    letter-spacing:0;font-family:"Inter",sans-serif;text-decoration:none;margin:0;
  }
  .diego-panel .chip:hover{border-color:var(--orange);color:var(--copper);}
  .diego-panel .chip svg{width:13px;height:13px;stroke:currentColor;flex-shrink:0;}

  .diego-input{
    display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);
    background:var(--surface);flex-shrink:0;margin:0;
  }
  .diego-input input{
    flex:1;border:1px solid var(--border);border-radius:100px;padding:10px 15px;
    font-size:14.5px;background:var(--bg);color:var(--ink);font-family:inherit;
  }
  .diego-input input:focus{outline:2px solid var(--orange);outline-offset:1px;}
  .diego-input .send-btn{
    width:40px;height:40px;border-radius:50%;border:none;background:var(--orange);
    color:var(--orange-ink);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  .diego-input .send-btn:hover{background:var(--copper);}
  .diego-input .send-btn svg{width:17px;height:17px;stroke:currentColor;}
  .diego-panel .foot-note{
    font-size:11px;color:var(--ink-faint);text-align:center;padding:0 14px 10px;
    background:var(--surface);margin:0;
  }

  @media (max-width:480px){
    .diego-panel{right:16px;left:16px;width:auto;bottom:88px;}
    .diego-launcher{right:16px;}
  }
</style>

<!-- ---------- Diego widget ---------- -->
<button class="diego-launcher" id="diegoLauncher" aria-label="Ouvrir l'assistant Diego" aria-expanded="false">
  <svg viewBox="0 0 64 64"><use href="#diegoFace"></use></svg>
  <span class="diego-badge" id="diegoBadge" aria-hidden="true">1</span>
</button>

<section class="diego-panel" id="diegoPanel" role="dialog" aria-label="Diego, assistant MunDrive">
  <div class="diego-head">
    <div class="diego-avatar">
      <svg viewBox="0 0 64 64"><use href="#diegoFace"></use></svg>
    </div>
    <div class="who">
      <div class="name">Diego</div>
      <div class="status"><span class="dot"></span> Assistant MunDrive · en ligne</div>
    </div>
    <button class="icon-btn" id="diegoMinimize" aria-label="Réduire la fenêtre">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>

  <div class="diego-thread" id="diegoThread">
    <div class="msg bot">
      <div class="mini-avatar"><svg viewBox="0 0 64 64"><use href="#diegoFace"></use></svg></div>
      <div class="bubble">Bonjour, je suis Diego, votre assistant MunDrive 🔧 Compatibilité de pièces, suivi de commande, conseils d'entretien — posez-moi votre question.</div>
    </div>
  </div>

  <div class="quick-row" id="quickRow">
    <button class="chip" data-topic="order"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>Suivre ma commande</button>
    <button class="chip" data-topic="newsletter"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>Recevoir mon bon de bienvenue</button>
  </div>

  <form class="diego-input" id="diegoForm">
    <input id="diegoInput" type="text" placeholder="Écrivez à Diego…" autocomplete="off" aria-label="Votre message">
    <button class="send-btn" type="submit" aria-label="Envoyer">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7z"></path></svg>
    </button>
  </form>
  <div class="foot-note">Diego peut se tromper — vérifiez les informations importantes.</div>
</section>

<script>
(function(){
  const thread = document.getElementById('diegoThread');
  const form = document.getElementById('diegoForm');
  const input = document.getElementById('diegoInput');
  const launcher = document.getElementById('diegoLauncher');
  const panel = document.getElementById('diegoPanel');
  const minimizeBtn = document.getElementById('diegoMinimize');
  const quickRow = document.getElementById('quickRow');
  const badge = document.getElementById('diegoBadge');

  const botAvatarSVG = '<svg viewBox="0 0 64 64"><use href="#diegoFace"></use></svg>';

  function scrollToBottom(){ thread.scrollTop = thread.scrollHeight; }

  function addMessage(role, html){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    if(role === 'bot'){
      wrap.innerHTML = '<div class="mini-avatar">'+botAvatarSVG+'</div><div class="bubble">'+html+'</div>';
    } else {
      wrap.innerHTML = '<div class="bubble"></div>';
      wrap.querySelector('.bubble').textContent = html;
    }
    thread.appendChild(wrap);
    scrollToBottom();
  }

  function showTyping(){
    const wrap = document.createElement('div');
    wrap.className = 'msg bot typing';
    wrap.id = 'typingIndicator';
    wrap.innerHTML = '<div class="mini-avatar">'+botAvatarSVG+'</div><div class="bubble"><span class="dot2"></span><span class="dot2"></span><span class="dot2"></span></div>';
    thread.appendChild(wrap);
    scrollToBottom();
  }
  function removeTyping(){
    const t = document.getElementById('typingIndicator');
    if(t) t.remove();
  }

  /* ---- quotas quotidiens par visiteur (repli local, utilisé seulement si le backend n'est pas joignable) ---- */
  const DAILY_LIMITS = { entretien: 30, compat: 30, general: 10 };

  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function getQuota(){
    let state;
    try { state = JSON.parse(localStorage.getItem('diegoQuota') || 'null'); } catch(e){ state = null; }
    const today = todayKey();
    if(!state || state.date !== today){
      state = { date: today, entretien: 0, compat: 0, general: 0 };
    }
    return state;
  }
  function saveQuota(state){
    try { localStorage.setItem('diegoQuota', JSON.stringify(state)); } catch(e){ /* navigation privée, etc. */ }
  }

  const ARTICLES = [
    { test: /plaquette|frein/i,
      title: "Changer ses plaquettes de frein : le guide complet",
      excerpt: "reconnaître l'usure, choisir la bonne référence et poser sans y laisser un dimanche.",
      href: "#" },
    { test: /occasion|reconditionn|pi[eè]ce moteur/i,
      title: "Occasion ou neuf : comment choisir sa pièce moteur",
      excerpt: "ce que change vraiment le kilométrage d'une pièce reconditionnée sur sa durée de vie.",
      href: "#" },
    { test: /hiver|frimas/i,
      title: "7 pièces à vérifier avant les premiers frimas",
      excerpt: "la liste que nos garagistes partenaires suivent chaque année.",
      href: "#" }
  ];

  const GENERAL_KNOWLEDGE = [
    { test: /distribution|courroie/i,
      html: "En général, une courroie de distribution se change tous les 60 000 à 160 000 km selon les constructeurs, ou tous les 5 à 10 ans si le véhicule roule peu. L'intervalle exact est précisé dans le carnet d'entretien de votre voiture." },
    { test: /pneu/i,
      html: "Un pneu se remplace en général tous les 40 000 à 50 000 km, ou dès que la profondeur des sculptures descend sous 1,6 mm (le minimum légal), et de toute façon après 5 à 10 ans même s'il est peu usé." },
    { test: /batterie/i,
      html: "Une batterie de voiture dure en moyenne 4 à 5 ans. Un démarrage difficile ou des équipements électriques capricieux sont souvent les premiers signes qu'il est temps de la faire contrôler." },
    { test: /huile|vidange/i,
      html: "La vidange se fait en général tous les 10 000 à 15 000 km, ou une fois par an selon ce qui arrive en premier — certains moteurs récents tolèrent des intervalles plus longs, à vérifier dans le carnet d'entretien." },
    { test: /bougie/i,
      html: "Les bougies d'allumage se changent en général tous les 30 000 à 100 000 km selon leur type (cuivre, platine, iridium) — le carnet d'entretien de votre véhicule précise l'intervalle exact." },
    { test: /embrayage/i,
      html: "Un embrayage dure en moyenne entre 100 000 et 150 000 km, mais cela varie beaucoup selon le type de trajets et la conduite." },
    { test: /amortisseur/i,
      html: "Les amortisseurs se changent en général tous les 80 000 km environ, ou dès que la tenue de route se dégrade (rebonds, distances de freinage qui rallongent)." },
    { test: /filtre/i,
      html: "Un filtre à air ou à habitacle se change en général tous les 15 000 à 30 000 km selon le modèle et l'usage." },
    { test: /essuie/i,
      html: "Des essuie-glaces se changent en général tous les 6 à 12 mois, ou dès qu'ils strient ou couinent sur le pare-brise." }
  ];

  const MAINTENANCE_LIKE = /entretien|conseil|guide|comment (faire|changer|poser)|plaquette|frein|distribution|courroie|pneu|batterie|huile|vidange|bougie|embrayage|amortisseur|filtre|essuie|hiver|frimas|moteur|occasion|neuf|reconditionn/i;
  const COMPAT_LIKE = /compat|r[ée]f[ée]rence|ref-|mod[eè]le|convient|va (avec|sur)|prix|stock|combien coute|combien ça coûte|j'ai besoin d'un|j'ai besoin d'une|il me faut un|il me faut une|je cherche un|je cherche une|je voudrais un|je voudrais une|feu |phare|optique|clignotant|pare-choc|r[ée]troviseur|poign[ée]e de porte|pare-brise|calandre|pot d'[ée]chappement/i;

  // la recherche WordPress par défaut exige tous les mots de la requête dans le
  // titre/contenu : on retire les mots de liaison pour ne garder que les mots
  // utiles ("j'ai besoin d'un feu bmw" -> "feu bmw"), sinon rien ne remonte.
  const SEARCH_STOPWORDS = new Set(["je","j","tu","il","elle","nous","vous","ils","elles","on","me","m","te","t","se","s","le","la","les","l","un","une","des","du","de","d","ai","as","a","avons","avez","ont","veux","veut","voudrais","voudrait","cherche","cherchons","cherchez","besoin","faut","faudrait","pour","avec","sans","que","qui","quoi","comment","ou","où","et","à","dans","sur","par","pas","ne","n","mon","ma","mes","ton","ta","tes","son","sa","ses","notre","nos","votre","vos","leur","leurs","est","être","suis","es","sommes","êtes","sont"]);
  function searchTerms(text){
    const kept = String(text || '').toLowerCase().split(/[\s'’]+/).filter(w => w && !SEARCH_STOPWORDS.has(w));
    const terms = kept.join(' ').trim();
    return terms || text || '';
  }

  function classify(text){
    if(/merci|top|parfait|super/i.test(text)) return { cat: null, kind: 'thanks' };
    if(/newsletter|abonn|infolettre/i.test(text)) return { cat: null, kind: 'newsletter' };
    if(/humain|quelqu.un|conseiller|parler [aà]|sav|service client|probl[eè]me|bloqu|command/i.test(text)) return { cat: null, kind: 'human' };
    if(COMPAT_LIKE.test(text)) return { cat: 'compat', kind: 'compat', q: text };
    if(MAINTENANCE_LIKE.test(text)){
      const article = ARTICLES.find(a => a.test.test(text));
      if(article) return { cat: 'entretien', kind: 'article', article: article };
      const known = GENERAL_KNOWLEDGE.find(g => g.test.test(text));
      if(known) return { cat: 'general', kind: 'general-known', info: known };
      return { cat: 'general', kind: 'general-fallback' };
    }
    return { cat: null, kind: 'fallback' };
  }

  function quotaMessage(cat){
    if(cat === 'entretien') return "Vous avez atteint la limite de 30 conseils entretien sourcés depuis notre site pour aujourd'hui 🙏 Revenez demain, ou écrivez directement à <strong>contact@mundrive.com</strong>.";
    if(cat === 'compat') return "Vous avez atteint la limite de 30 questions compatibilité / produits pour aujourd'hui. Revenez demain, ou écrivez à <strong>contact@mundrive.com</strong> pour une réponse rapide.";
    return "Vous avez atteint la limite de 10 questions générales (non sourcées par le site) pour aujourd'hui. Je reste disponible pour vos questions sur nos pièces, leur compatibilité, ou nos articles !";
  }

  const FALLBACK = "Je n'ai pas de réponse toute prête pour cette question précise. Voici ce que je sais faire en revanche&nbsp;: vérifier la compatibilité d'une pièce, vous orienter vers un article du blog, ou gérer votre abonnement à la newsletter — et pour tout le reste, <strong>contact@mundrive.com</strong> vous répond sous 24h.";

  function buildReply(c){
    switch(c.kind){
      case 'compat':
        return "Vous devriez trouver ça dans notre boutique — repérez la pièce qui correspond à votre véhicule. Chaque fiche produit a une description détaillée avec les modèles compatibles, à bien vérifier avant d'acheter. Un doute&nbsp;? Écrivez à <strong>contact@mundrive.com</strong>, réponse sous 24h." + linkChip('/?s=' + encodeURIComponent(searchTerms(c.q)) + '&post_type=product', 'Voir la boutique');
      case 'article':
        return "Bonne question&nbsp;! Notre atelier a justement écrit un article là-dessus&nbsp;: <strong>" + c.article.title + "</strong> — " + c.article.excerpt + ' <a class="link-chip" href="' + c.article.href + '">Lire l\'article<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"></path></svg></a>';
      case 'general-known':
        return c.info.html + " <em>(Information générale à titre indicatif&nbsp;: vérifiez toujours le carnet d'entretien de votre véhicule ou demandez l'avis d'un professionnel.)</em>";
      case 'general-fallback':
        return "Je n'ai pas encore d'article dédié à ce sujet sur le site, mais en règle générale le meilleur réflexe reste de consulter le carnet d'entretien de votre véhicule ou un garagiste pour un diagnostic précis. Je reste à votre disposition pour toute question sur nos pièces et leur compatibilité !";
      case 'newsletter':
        return "Avec plaisir ! Un bon de bienvenue de 10 € vous attend, sans minimum d'achat et valable 1 an. Cliquez sur le lien ci-dessous pour vous inscrire et le recevoir !" + linkChip('/', 'Recevoir mon bon de bienvenue');
      case 'human':
        return "Je vous mets en relation avec l'équipe MunDrive&nbsp;: écrivez à <strong>contact@mundrive.com</strong> en décrivant votre situation, vous aurez une réponse sous 24h.";
      case 'thanks':
        return "Avec plaisir&nbsp;! Autre chose sur une pièce, un article ou votre abonnement&nbsp;?";
      default:
        return FALLBACK;
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function linkChip(url, label){
    return ' <a class="link-chip" href="' + escapeHtml(url) + '">' + escapeHtml(label) +
      '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"></path></svg></a>';
  }

  function renderServerAnswer(data){
    let html = escapeHtml(data.answer || '').replace(/\n/g, '<br>');
    if(data.article && data.article.url){
      html += linkChip(data.article.url, "Lire l'article");
    }
    if(data.product && data.product.url){
      html += linkChip(data.product.url, 'Voir le produit');
    }
    if(data.link && data.link.url){
      html += linkChip(data.link.url, data.link.label || 'En savoir plus');
    }
    return html;
  }

  async function respondTo(text){
    try {
      const res = await fetch('/wp-json/mundrive/v1/diego-ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ question: text })
      });
      if(res.ok){
        const data = await res.json();
        showTyping();
        const delay = 250 + Math.random()*300;
        setTimeout(function(){
          removeTyping();
          addMessage('bot', renderServerAnswer(data));
        }, delay);
        return;
      }
    } catch(e){ /* backend injoignable : repli local ci-dessous */ }

    const c = classify(text);
    let allowed = true;
    if(c.cat){
      const state = getQuota();
      if(state[c.cat] >= DAILY_LIMITS[c.cat]){
        allowed = false;
      } else {
        state[c.cat] += 1;
        saveQuota(state);
      }
    }
    showTyping();
    const delay = 650 + Math.random()*450;
    setTimeout(function(){
      removeTyping();
      addMessage('bot', allowed ? buildReply(c) : quotaMessage(c.cat));
    }, delay);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const val = input.value.trim();
    if(!val) return;
    addMessage('user', val);
    input.value = '';
    respondTo(val);
  });

  quickRow.addEventListener('click', function(e){
    const chip = e.target.closest('.chip');
    if(!chip) return;
    const topic = chip.dataset.topic;
    if(!topic) return;
    const asUser = {
      order: "Je veux suivre ma commande.",
      newsletter: "Je veux m'abonner pour recevoir mon bon de bienvenue."
    }[topic];
    addMessage('user', asUser);
    respondTo(asUser);
  });

  function setOpen(open){
    panel.hidden = !open;
    launcher.setAttribute('aria-expanded', String(open));
    launcher.style.display = open ? 'none' : 'flex';
    if(open){ input.focus(); badge.hidden = true; }
  }

  launcher.addEventListener('click', function(){ setOpen(true); });
  minimizeBtn.addEventListener('click', function(){ setOpen(false); });

  setOpen(false);

  (async function(){
    try {
      const res = await fetch('/wp-json/mundrive/v1/diego-whoami', { credentials: 'same-origin' });
      if(!res.ok) return;
      const who = await res.json();
      if(who.logged_in && who.first_name){
        const firstBubble = thread.querySelector('.msg.bot .bubble');
        if(firstBubble){
          firstBubble.innerHTML = firstBubble.innerHTML.replace('Bonjour, je suis Diego', 'Bonjour ' + escapeHtml(who.first_name) + ', je suis Diego');
        }
      }
    } catch(e){ /* pas de backend joignable : accueil générique, pas grave */ }
  })();
})();
</script>
